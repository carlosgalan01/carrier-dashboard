<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrier Sales Dashboard Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080a;
      --panel: #0c0e12;
      --panel-2: #101319;
      --text: #f4f5f7;
      --muted: #8a909c;
      --faint: #4d6aa3;
      --line: #1c2027;
      --line-strong: #272c35;
      --accent: #3b82f6;
      --accent-soft: rgba(59,130,246,0.12);
      --danger: #f0506e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(90% 70% at 50% -10%, #111723 0%, transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login-shell { width: min(420px, 100%); }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      flex: none;
    }
    .title h1 { font-size: 17px; font-weight: 700; line-height: 1.1; }
    .title p { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 22px;
    }
    .kicker {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h2 { font-size: 22px; letter-spacing: -0.02em; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 20px; }
    label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 14px 0 7px;
    }
    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      font: 500 14px Inter, sans-serif;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    button {
      width: 100%;
      height: 42px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: 700 14px Inter, sans-serif;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--danger) 42%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      color: var(--text);
      font-size: 13px;
    }
    body.has-error .error { display: block; }
    .foot {
      margin-top: 14px;
      text-align: center;
      color: var(--faint);
      font: 500 11px "JetBrains Mono", ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      </div>
      <div class="title">
        <h1>Carrier Sales &middot; Ops Console</h1>
        <p>AI freight brokerage agent telemetry</p>
      </div>
    </div>
    <section class="panel">
      <div class="kicker">Secure Access</div>
      <h2>Sign in</h2>
      <p class="sub">Use the dashboard credentials configured by your operations team.</p>
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Open Dashboard</button>
      </form>
      <div class="error">Invalid username or password.</div>
    </section>
    <div class="foot">Protected dashboard</div>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.body.classList.add('has-error');
    }
  </script>
</body>
</html>
